name: Run Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment

env:
  ENVIRONMENT: ${{ inputs.environment || 'Production' }}

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'Production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Downcase environment
        run: |
          echo "ENVIRONMENT_LC=${ENVIRONMENT,,}" >>${GITHUB_ENV}

      - name: Get base domain from APP_URL
        run: |
          echo "BASE_DOMAIN=$(echo ${{ vars.APP_URL }} | sed 's|https\?://||')" >>${GITHUB_ENV}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--prefer-dist --optimize-autoloader --no-dev"

      - name: Install osls + Lift
        run: |
          npm install -g osls@4
          npm ci
          npx serverless plugin install -n serverless-lift

      - name: Run Migration
        run: serverless bref:cli --args="migrate --force" --stage=${{ env.ENVIRONMENT_LC }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          BASE_DOMAIN: ${{ env.BASE_DOMAIN }}
          AWS_CERTIFICATE_ARN: ${{ vars.AWS_CERTIFICATE_ARN }}
